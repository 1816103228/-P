[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "interview-coach-xiaop"
version = "0.1.0"
description = "基于 DeepSeek 的 Python/后端面试模拟与辅导 Agent（面试官小P）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31,<3",
    "beautifulsoup4>=4.12,<5",
    "dashscope>=1.20,<2",
    "lxml>=5.0,<6",
    "apscheduler>=3.10,<4",
    "openai>=1.40,<3",
    "python-dotenv>=1.0,<2",
    "fastapi>=0.110,<1",
    "uvicorn>=0.30,<1",
    "edge-tts>=6.1,<8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "httpx>=0.27,<1",
    "ruff>=0.5,<1",
]

[project.scripts]
xiaop-voice = "app.voice_server:main"
xiaop-crawl = "app.crawler.run:main"

[tool.setuptools]
packages = ["app", "app.agent", "app.crawler", "app.ui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["app", "tests"]
exclude = ["data", ".git", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
# 中文内容/CSS/SVG 字符串多为长行，硬拆行反而伤可读性，统一忽略行宽检查
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
