<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>面试官小P · 语音通话</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html,body { height:100%; }
body {
  font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  background:radial-gradient(1200px 600px at 20% -10%, #3b4f8f 0%, #22304f 45%, #141c30 100%);
  color:#f4f6fb;
  display:flex; justify-content:center;
  min-height:100dvh;
}
.phone { width:min(480px,100%); min-height:100dvh; display:flex; flex-direction:column; padding:18px 18px calc(110px + env(safe-area-inset-bottom)); }
.phone::before { content:""; position:fixed; inset:0; z-index:-1; background:
  radial-gradient(520px 300px at 85% -5%, rgba(120,150,255,.28), transparent 60%),
  radial-gradient(420px 260px at -10% 30%, rgba(255,120,160,.14), transparent 60%),
  radial-gradient(600px 340px at 50% 115%, rgba(47,191,113,.12), transparent 60%); }
.top { display:flex; align-items:center; justify-content:space-between; gap:8px; }
.top .back { color:#9fb2d9; text-decoration:none; font-size:13px; }
.top .back:hover { color:#fff; }
.top .title { font-size:17px; font-weight:700; letter-spacing:1px; }
.mode { font-size:12px; color:#ffd166; background:rgba(255,209,102,.12); border:1px solid rgba(255,209,102,.35); padding:2px 10px; border-radius:999px; white-space:nowrap; }
.avatar { display:flex; justify-content:center; padding:8px 0 0; }
.avatar img { width:230px; height:230px; object-fit:cover; object-position:center 28%; border-radius:50%;
  border:3px solid rgba(255,255,255,.22); box-shadow:0 16px 42px rgba(10,16,34,.55); display:block; }
.avatar.glow img { filter:drop-shadow(0 0 28px rgba(109,134,245,.75)); transition:filter .35s ease; }
.av-fig { animation: br 4.5s ease-in-out infinite; }
@keyframes br { 0%,100%{transform:translateY(0) rotate(0deg)} 25%{transform:translateY(-5px) rotate(-.5deg)} 75%{transform:translateY(-3px) rotate(.5deg)} }
.statusrow { display:flex; align-items:center; justify-content:center; gap:10px; margin-top:16px; }
.status { min-width:170px; text-align:center; font-size:14px; color:#d7e0f5; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.14); padding:7px 18px; border-radius:999px; backdrop-filter:blur(8px); }
.status.busy { color:#ffd166; border-color:rgba(255,209,102,.45); }
.status.interruptible { cursor:pointer; border-color:rgba(255,209,102,.75); text-decoration:underline dotted; }
.microw { display:none; align-items:center; justify-content:center; gap:8px; margin-top:10px; font-size:12px; color:#9fb2d9; }
.microw.on { display:flex; }
.microw .miclabel { white-space:nowrap; }
.micbar { width:130px; height:6px; background:rgba(255,255,255,.12); border-radius:3px; overflow:hidden; }
.micbar i { display:block; height:100%; width:0; background:linear-gradient(90deg,#4f6ef7,#2fbf71); transition:width .06s linear; }
#micTest { border:1px solid rgba(255,255,255,.25); background:rgba(255,255,255,.08); color:#d7e0f5; border-radius:999px; padding:3px 12px; font-size:12px; cursor:pointer; }
#micTest:hover { border-color:rgba(255,255,255,.5); color:#fff; }
.timer { font-size:13px; color:#9fb2d9; font-variant-numeric:tabular-nums; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12); padding:6px 12px; border-radius:999px; min-width:58px; text-align:center; }
.wave { display:none; justify-content:center; align-items:center; gap:5px; height:22px; margin-top:12px; }
.wave.on { display:flex; }
.wave i { width:4px; height:7px; border-radius:2px; background:#6e8bff; animation:wv 0.85s ease-in-out infinite; }
.wave i:nth-child(2) { animation-delay:.12s; } .wave i:nth-child(3) { animation-delay:.24s; }
.wave i:nth-child(4) { animation-delay:.36s; } .wave i:nth-child(5) { animation-delay:.48s; }
@keyframes wv { 0%,100% { height:6px; opacity:.5; } 50% { height:20px; opacity:1; } }
.transcript { flex:1; margin-top:16px; overflow-y:auto; display:flex; flex-direction:column; gap:10px; padding:4px 2px; min-height:120px; max-height:44vh; }
.bubble { max-width:84%; padding:10px 14px; border-radius:16px; font-size:14px; line-height:1.65; white-space:pre-wrap; word-break:break-word; animation:fadeIn .25s ease; }
@keyframes fadeIn { from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;} }
.bubble.user { align-self:flex-end; background:linear-gradient(135deg,#5b7cff,#4f6ef7); color:#fff; border-bottom-right-radius:4px; box-shadow:0 4px 14px rgba(79,110,247,.28); }
.bubble.assistant { align-self:flex-start; background:rgba(255,255,255,.10); color:#eef2fb; border-bottom-left-radius:4px; backdrop-filter:blur(8px); }
.bubble.hint { align-self:center; background:transparent; color:#8fa3cc; font-size:12px; padding:2px 6px; max-width:92%; }
.footer { position:fixed; left:0; right:0; bottom:calc(26px + env(safe-area-inset-bottom)); display:flex; justify-content:center; pointer-events:none; }
#callBtn { pointer-events:auto; width:70px; height:70px; border-radius:50%; border:none; cursor:pointer; font-size:26px; color:#fff; background:#2fbf71; box-shadow:0 6px 24px rgba(47,191,113,.45); transition:all .25s; }
#callBtn:hover { transform:scale(1.07); }
#callBtn .lbl { display:block; font-size:11px; font-weight:600; margin-top:-3px; letter-spacing:1px; }
#callBtn.on { background:#e74c3c; animation:micPulse .9s ease-in-out infinite; }
@keyframes micPulse { 0%,100%{box-shadow:0 0 0 0 rgba(231,76,60,.45);} 50%{box-shadow:0 0 0 16px rgba(231,76,60,0);} }
</style>
</head>
<body>
<div class="phone">
  <div class="top">
    <a class="back" href="__WEB_URL__" target="_blank">← 文字版</a>
    <div class="title">🎤 面试官小P</div>
    <div class="mode" id="mode">辅导答疑</div>
  </div>

  <div class="avatar">
    <div class="av-fig">
      <img src="/assets/avatar.png" alt="面试官小P">
    </div>
  </div>

  <div class="statusrow">
    <div class="status" id="status">未连接 · 点击下方按钮接通</div>
    <div class="timer" id="timer">00:00</div>
  </div>

  <div class="microw" id="microw">
    <span class="miclabel">麦克风</span>
    <div class="micbar"><i id="micbar"></i></div>
    <button id="micTest" title="录 2 秒并回放，确认麦克风正常">测试</button>
  </div>

  <div class="wave" id="wave"><i></i><i></i><i></i><i></i><i></i></div>

  <div class="transcript" id="transcript">
    <div class="bubble hint">接通后小P会先问候你。直接说话即可提问；说「开始面试」自动切换为模拟面试。小P播报时点击上方状态条可立即打断。</div>
  </div>
</div>

<div class="footer">
  <button id="callBtn" title="接通 / 挂断">📞<span class="lbl">接通</span></button>
</div>

<!-- 调试面板：URL 加 ?debug=1 显示识别器实时状态与日志 -->
<div id="dbg" style="display:none;position:fixed;left:8px;bottom:8px;z-index:999;max-width:48vw;font:11px/1.5 ui-monospace,Consolas,monospace;color:#9fe8b2;background:rgba(10,16,34,.94);padding:6px 8px;border-radius:6px;white-space:pre-wrap;"></div>

<script>
(function(){
var d=document, w=window;
var btn=d.getElementById('callBtn'), st=d.getElementById('status'),
    tx=d.getElementById('transcript'), modeEl=d.getElementById('mode');
if(!btn||!st||!tx)return;

var V=w.__voiceState;
if(!V){V=w.__voiceState={
  active:false,ws:null,buf:'',speaking:false,bound:false,
  audioCtx:null,playingAudio:false,replyEnded:false,suppressAudio:false,
  sidData:{},playQueue:[],activeSources:[],nextPlaySid:0,playTime:0,pendingSources:0,
  skippedSids:{},fallbackBySid:{},fallbackQueue:[],liveBubble:null,
  timerStart:0,timerInt:null,fallbackActive:0,
  lastSend:0,lastSendText:'',
  mic:null,micProc:null,asrReady:false,asrRetries:0,asrSampleRate:16000,
  lastAsrEvent:0,vadAvg:0,
  speakingText:'',prevSpeechText:'',echoUntil:0,
  vadOn:false,analyser:null,vadData:null,vadHits:0,quietTicks:0,bargeArmed:false,noiseFloor:0,bargeWait:0
};}

// 打断用音量阈值（回声由 getUserMedia 的回声消除处理，麦克风残留远低于人声）。
// 阈值/帧数均可由后端 .env 配置；另加自适应底噪：环境吵时自动抬高有效阈值，防误打断。
var VAD_THRESHOLD=parseFloat(__VAD_THRESHOLD__);
var VAD_HITS=parseInt(__VAD_HITS__,10);            // 连续超阈值帧数（约 60ms/帧），需持续说话才打断
var VAD_QUIET_FRAMES=parseInt(__VAD_QUIET_FRAMES__,10); // 播报开始后需先安静片刻再武装，防自己话尾误打断
var VAD_NOISE_MARGIN=parseFloat(__VAD_NOISE_MARGIN__);  // 有效阈值 = max(固定阈值, 环境底噪×系数)
// 与服务端一致的模式切换触发词（避免"模拟面试是什么"这类提问误切模式）
var MOCK_START_RE=/(开始面试|开始模拟面试|^(?:我想|我要)?模拟面试(?:吧|一下|下|了)?$|(?:我想|我要|来|做|进行|试试|开启|帮我|开始一[场次]).{0,4}模拟面试)/;

// ---- 调试面板（?debug=1 启用）：实时显示识别器状态与事件日志 ----
var _dbgOn=(w.location.search.indexOf('debug')>=0);
var dbgEl=null,_dbgLog='';
function _dbg(msg){
  if(!_dbgOn)return;
  if(!dbgEl){dbgEl=d.getElementById('dbg');if(dbgEl)dbgEl.style.display='block';}
  if(!dbgEl)return;
  var t=new Date(),ts=('0'+t.getHours()).slice(-2)+':'+('0'+t.getMinutes()).slice(-2)+':'+('0'+t.getSeconds()).slice(-2);
  _dbgLog=(_dbgLog+'\n'+ts+' '+msg).split('\n').slice(-16).join('\n');
  var head='speaking:'+(V.speaking?'Y':'N')+' mic:'+(V.mic?'Y':'N')+' asr:'+(V.asrReady?'Y':'N')+' lv:'+Math.round((V.micLevel||0)*260);
  dbgEl.textContent=head+'\n'+_dbgLog;
}
function setStatus(t,busy){
  st.textContent=t;
  st.classList.toggle('busy',!!busy);
}
function setSpeakingUI(on){
  var wave=d.getElementById('wave');
  var av=d.querySelector('.avatar');
  if(wave)wave.classList.toggle('on',on);
  if(av)av.classList.toggle('glow',on);
  if(st)st.classList.toggle('interruptible',!!on); // 播报中点击状态条 = 手动打断
}
function updateTimer(){
  if(!V.active)return;
  var el=d.getElementById('timer');
  if(!el)return;
  var s=Math.max(0,Math.floor((Date.now()-V.timerStart)/1000));
  var m=Math.floor(s/60);
  el.textContent=('0'+m).slice(-2)+':'+('0'+(s%60)).slice(-2);
}
function render(){
  btn.innerHTML=V.active?'⏹<span class="lbl">挂断</span>':'📞<span class="lbl">接通</span>';
  btn.classList.toggle('on',V.active);
}
function addBubble(role,text){
  var div=d.createElement('div');
  div.className='bubble '+role;
  div.textContent=text;
  tx.appendChild(div);
  tx.scrollTop=tx.scrollHeight;
  return div;
}
function updateLive(text){
  if(!V.liveBubble)V.liveBubble=addBubble('assistant','');
  V.liveBubble.textContent=text;
  tx.scrollTop=tx.scrollHeight;
}
function setMode(m){
  if(modeEl)modeEl.textContent=m;
}
function fetchCustomStatus(){
  // 文字版生成定制面试后，这里提示并直接以"定制面试"模式呈现
  fetch('/api/voice/custom').then(function(r){return r.json();}).then(function(data){
    if(data&&data.ready){
      setMode('定制面试');
      var hint=tx.querySelector('.bubble.hint');
      if(hint){
        var title=data.job_title||'自定义岗位';
        hint.textContent='已为你准备好「'+title+'」定制面试，接通后小P会直接开始。';
      }
    }
  }).catch(function(){});
}

function ensureAudio(){
  if(!V.audioCtx){
    try{var AC=w.AudioContext||w.webkitAudioContext;V.audioCtx=new AC();}catch(e){}
  }
}
function bytesToB64(bytes){
  var bin='',chunk=0x8000;
  for(var i=0;i<bytes.length;i+=chunk){bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+chunk));}
  return btoa(bin);
}
// 麦克风采集 → 16bit PCM → 经 WebSocket 送后端 DashScope ASR 流式识别
function startAudioStream(){
  if(V.mic)return;
  if(!w.navigator.mediaDevices||!w.navigator.mediaDevices.getUserMedia){setStatus('请用 Chrome / Edge 浏览器');return;}
  w.navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}})
  .then(function(stream){
    var AC=w.AudioContext||w.webkitAudioContext;
    // 复用 connect 里创建的 ctx（用户手势内创建，避免 autoplay 挂起）；采样率以实际为准
    var ctx=V.audioCtx||new AC();
    if(ctx.state==='suspended'){try{ctx.resume();}catch(e){}}
    V.audioCtx=ctx;
    var src=ctx.createMediaStreamSource(stream);
    var proc=ctx.createScriptProcessor(4096,1,1);
    proc.onaudioprocess=function(e){
      var data=e.inputBuffer.getChannelData(0);
      var rms=calcRms(data);
      V.micLevel=rms; // 供调试面板/电平表实时显示，判断麦克风是否在工作
      updateMicMeter(rms);
      // 音量级打断兜底：ASR 长时间没出结果（网络/密钥问题）时，用音量检测用户开口
      if(V.speaking)vadCheck(rms);
      if(!V.ws||V.ws.readyState!==1||!V.asrReady)return;
      // 持续监听：麦克风音频始终发送给 ASR（不因播报而静音）。
      // 小P 播报的回声会被 ASR 识别成文本，由 handleAsrText 的 _isEchoLike
      // 内容级过滤（与正在播报内容比对）忽略；用户真实说话则正常触发打断。
      var pcm=new Int16Array(data.length);
      for(var i=0;i<data.length;i++){
        var s=Math.max(-1,Math.min(1,data[i]));
        pcm[i]=(s<0?s*0x8000:s*0x7FFF)|0;
      }
      V.ws.send(JSON.stringify({type:'audio',data:bytesToB64(new Uint8Array(pcm.buffer))}));
    };
    var g=ctx.createGain();g.gain.value=0; // 静音输出，避免把采集声音播出来
    proc.connect(g);g.connect(ctx.destination);
    V.mic=stream;V.micProc=proc;
    var mw=d.getElementById('microw');
    if(mw)mw.classList.add('on'); // 显示麦克风电平表
    if(V.ws&&V.ws.readyState===1){
      V.asrSampleRate=ctx.sampleRate; // 记住实际采样率，供 ASR 失败重试时复用
      V.ws.send(JSON.stringify({type:'asr_start',sample_rate:ctx.sampleRate}));
      _dbg('音频采集启动 sampleRate='+ctx.sampleRate);
    }
  }).catch(function(e){setStatus('麦克风不可用: '+(e&&e.name||e));});
}
function calcRms(data){
  var sum=0;
  for(var i=0;i<data.length;i++){var s=data[i];sum+=s*s;}
  return Math.sqrt(sum/data.length);
}
function updateMicMeter(rms){
  var bar=d.getElementById('micbar');
  if(!bar)return;
  var lv=Math.min(100,Math.round(rms*260));
  bar.style.width=lv+'%';
  bar.style.background=lv>42?'linear-gradient(90deg,#ffd166,#ff8c69)':'linear-gradient(90deg,#4f6ef7,#2fbf71)';
}
// 麦克风测试：录 2 秒并回放，能听到自己说明麦克风→扬声器链路正常
function micTest(){
  if(!V.mic){setStatus('麦克风未启动，请先点「接通」',true);return;}
  var ctx=V.audioCtx;
  if(!ctx)return;
  var rec=[],started=Date.now();
  var src=ctx.createMediaStreamSource(V.mic);
  var proc=ctx.createScriptProcessor(4096,1,1);
  var g=ctx.createGain();g.gain.value=0;
  proc.connect(g);g.connect(ctx.destination);
  src.connect(proc);
  proc.onaudioprocess=function(e){
    var t=e.inputBuffer.getChannelData(0);
    for(var i=0;i<t.length;i++)rec.push(t[i]);
    if(Date.now()-started>=2000){
      try{src.disconnect();proc.disconnect();}catch(err){}
      playRecorded(rec,ctx.sampleRate);
    }
  };
  setStatus('正在录音 2 秒…，请对着麦克风说话',true);
}
function playRecorded(samples,sr){
  try{
    var ctx=V.audioCtx;
    var buf=ctx.createBuffer(1,samples.length,sr);
    buf.copyToChannel(new Float32Array(samples),0);
    var s=ctx.createBufferSource();s.buffer=buf;s.connect(ctx.destination);s.start();
    setStatus('已回放你的声音（约 2 秒）');
  }catch(e){
    setStatus('回放失败: '+e,true);
  }
}
// 音量打断（兜底）：仅在 ASR 静默超过 1.5s 时启用；阈值用慢速平均跟踪回声/底噪，
// 用户开口的音量尖峰明显高于平均值才会触发，避免小P 自己的回声误打断
function vadCheck(rms){
  if(V.lastAsrEvent&&Date.now()-V.lastAsrEvent<1500)return; // ASR 正常时交给内容级打断
  V.vadAvg=(V.vadAvg>0?V.vadAvg:rms)*0.995+rms*0.005;
  var thr=Math.max(VAD_THRESHOLD,V.vadAvg*VAD_NOISE_MARGIN);
  if(rms>thr){V.vadHits++;}else{V.vadHits=0;}
  if(V.vadHits>=VAD_HITS){
    V.vadHits=0;
    _dbg('音量打断 rms='+rms.toFixed(3)+' thr='+thr.toFixed(3));
    bargeIn();
  }
}
function stopAudioStream(){
  if(V.micProc){try{V.micProc.disconnect();}catch(e){}V.micProc=null;}
  if(V.mic){try{V.mic.getTracks().forEach(function(t){t.stop();});}catch(e){}V.mic=null;}
  V.asrReady=false;
  V.lastAsrEvent=0;
  var mw=d.getElementById('microw');
  if(mw)mw.classList.remove('on');
  var bar=d.getElementById('micbar');
  if(bar)bar.style.width='0';
}
function sendText(t){
  if(V.ws&&V.ws.readyState===1){
    var now=Date.now();
    // 防抖：同一句最终识别结果 2 秒内不重复发送，避免连续打断自己刚触发的回复
    if(V.lastSendText===t&&now-V.lastSend<2000)return;
    V.lastSend=now;V.lastSendText=t;
    _dbg('sendText: '+t.slice(0,20));
    // 用户开口说话 → 立即停掉上一轮未播完的音频并复位状态，
    // 否则新旧回复的 sid 会冲突、回声基准不重置，导致新回复被误打断
    stopAudio();
    V.speaking=false;
    V.echoUntil=Date.now()+2500; // 与 bargeIn 一致：拦截已进 ASR 管线的旧回声迟到到达（ASR 延迟可达 2s）
    V.replyEnded=false;V.buf='';V.liveBubble=null;
    // 注意：不清空 speakingText、不关闭 echoUntil——打断前已进入 ASR 管线的
    // 回声文本有 1-2s 延迟，仍需按播报内容过滤；新回复 reply_start 到达时再重置
    addBubble('user',t);
    if(MOCK_START_RE.test(t))setMode('模拟面试');
    V.ws.send(JSON.stringify({type:'text',content:t}));
    setStatus('小P思考中…',true);
  }
}
// ASR 识别文本处理：播报中先做内容级回声过滤，非回声 → 打断小P并发送
function handleAsrText(text){
  text=(text||'').trim();
  if(!text)return;
  V.lastAsrEvent=Date.now();
  _dbg('ASR句子: '+text.slice(0,16));
  // 回声窗口过期：释放上一轮播报文本基准，避免长期吞掉与旧内容相似的插话
  if(V.prevSpeechText&&Date.now()>=V.echoUntil){V.prevSpeechText='';}
  if(V.speaking||Date.now()<V.echoUntil){
    // 播报中，或刚播完的回声窗口内（ASR 有 1-2s 延迟，播完的回声可能后到）
    if(_isEchoLike(text)){_dbg('回声忽略(整句): '+text.slice(0,20));return;}
    _dbg('插话识别: '+text.slice(0,20));
  }
  sendText(text); // sendText 内部 stopAudio 打断小P
}
// 回声判断：识别文本与正在（或刚刚）播报内容高度一致 → 小P 的播报回声。
// 原则：宁可偶尔把"疑似回声"的用户插话忽略（用户可再说一遍），
// 也绝不让小P 的回声漏判（否则小P 自问自答/被自己打断）。
function _isEchoLike(text){
  var t=(text||'').replace(/[^\u4e00-\u9fa5a-zA-Z0-9]/g,'');
  if(!t)return false;
  // 当前回复文本（含正在播报内容）匹配 → 回声
  var b=(V.speakingText||'').replace(/[^\u4e00-\u9fa5a-zA-Z0-9]/g,'');
  if(_echoMatch(t,b))return true;
  // 打断后回声窗口内：上一轮回复文本也参与匹配——打断前 1-2s 已进入 ASR 管线的
  // 旧播报回声此刻才识别完成，若只比对新回复文本必然失配，导致新回复刚开口又被
  // 旧回声打断（"打断→又被断"循环）。窗口过期（echoUntil）后自动失效。
  if(V.prevSpeechText&&Date.now()<V.echoUntil){
    var pb=(V.prevSpeechText||'').replace(/[^\u4e00-\u9fa5a-zA-Z0-9]/g,'');
    if(_echoMatch(t,pb))return true;
  }
  return false;
}
// 单文本基准匹配核心：t 是否为 b 的播报回声（容忍 ASR 同音/漏字/插入误差）
function _echoMatch(t,b){
  if(!t||!b)return false;
  // 1-2 字的插话（"好""继续""停"）不足以判定为回声：放行，避免把用户打断吞掉
  if(t.length<3)return false;
  // 1）完全子串：识别文本是播报文本的连续片段 → 回声（≥3 字才判定，
  //    避免"好""继续"这类 1-2 字的真实插话被当成回声吞掉）。
  if(b.indexOf(t)>=0)return true;
  if(t.length<8){
    // 2a）短-中文本（<8 字）：在 b 中找与 t 等长、至多 1 字差异的连续片段。
    //     覆盖同音字识别误差（"好的"→"好滴"、"小P"→"小批"）；
    //     用户短插话（"这个""继续"）几乎不会与播报文本出现"仅 1 字差异"片段。
    var s=0;
    while((s=b.indexOf(t[0],s))>=0){
      var seg=b.substr(s,t.length);
      if(seg.length===t.length){
        var diff=0;
        for(var i=0;i<t.length;i++){if(seg[i]!==t[i])diff++;}
        if(diff<=1)return true;
      }
      s++;
    }
    // 2b）子序列覆盖 ≥70%：覆盖漏字/插入虚词（"先做一分钟"、"好没问题"），
    //     按顺序匹配，用户插话与播报文本顺序一致的字符少，不会误吞。
    var j=0,n=0;
    for(var i=0;i<t.length;i++){
      j=b.indexOf(t[i],j);
      if(j<0)break;
      n++;j++;
    }
    if(n/t.length>=0.7)return true;
    return false;
  }
  // 3）最长连续公共片段 ≥ max（5，识别文本75%）→ 回声。
  //    阈值取 75%：回声是播报内容的变形，绝大部分字符连续重合；而用户
  //    "复述问题开头+新内容"的回答（如小P 问"有没有用过 Python 做数据
  //    分析"，用户答"Python 做过，实习用了半年"）只与播报文本开头连续
  //    重合，到不了 75%，避免吞掉面试中的高频回答。
  var need=Math.max(5,Math.floor(t.length*0.75));
  var best=0;
  for(var i=0;i<t.length&&best<need;i++){
    for(var j=0;j<b.length&&best<need;j++){
      var k=0;
      while(i+k<t.length&&j+k<b.length&&t[i+k]===b[j+k])k++;
      if(k>best)best=k;
    }
  }
  if(best>=need)return true;
  // 4）字符重合率兜底（ASR 严重变形时）：≥8 字文本重合率 ≥0.75。
  var hit=0;
  for(var i=0;i<t.length;i++){if(b.indexOf(t[i])>=0)hit++;}
  if(hit/t.length>=0.75)return true;
  return false;
}

/* ---- 音频：按 sid 缓冲、按序零间隙播放（消除句间停顿）---- */
function base64ToBytes(b64){
  var bin=atob(b64),bytes=new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  return bytes;
}
function onAudioStart(sid,text){
  if(V.suppressAudio)return; // 打断/挂断后，旧回复在途 audio_start 直接忽略
  V.replyEnded=false;
  V.fallbackBySid[sid]=text||'';
  if(V.nextPlaySid===0)V.nextPlaySid=sid;
  V.vadAvg=0; // 新一轮播报重新测量回声/底噪基线
  if(!V.speaking){
    _dbg('播报开始: '+(text||'').slice(0,22));
    // 播报中也持续发送音频给 ASR：用户开口会被识别为非回声内容 → 立即打断；
    // 小P 自己的回声被识别到时，由 _isEchoLike 内容过滤忽略
    V.speaking=true;setStatus('播报中…',true);setSpeakingUI(true);
    V.quietTicks=0;V.vadHits=0;V.bargeArmed=false;V.noiseFloor=0;V.bargeWait=0;
  }else{
    // 同回复后续句：只清计数，保留噪声基线与武装状态——否则每句都重新武装，
    // 句间停顿被当成"安静"→ 下一句回声强音被误判为用户开口（VAD 误打断）
    V.quietTicks=0;V.vadHits=0;
  }
}
function onAudioFrame(sid,b64){
  if(V.suppressAudio)return; // 打断/挂断后：在途旧音频帧直接忽略，不创建 ctx
  ensureAudio();
  if(!V.audioCtx)return;
  var bytes=base64ToBytes(b64);
  var prev=V.sidData[sid];
  var merged=new Uint8Array((prev?prev.length:0)+bytes.length);
  if(prev)merged.set(prev,0);
  merged.set(bytes,prev?prev.length:0);
  V.sidData[sid]=merged;
}
function onAudioEnd(sid){
  var bytes=V.sidData[sid];
  delete V.sidData[sid];
  delete V.fallbackBySid[sid];
  if(!bytes||!bytes.length){
    // 该 sid 没有音频帧（异常路径）：登记跳过，避免播放队列卡在等它
    if(!V.suppressAudio){V.skippedSids[sid]=true;scheduleReady();}
    return;
  }
  ensureAudio();
  V.audioCtx.decodeAudioData(bytes.buffer.slice(0),function(buf){
    if(V.suppressAudio)return;
    V.playQueue.push({sid:sid,buf:buf});
    V.playQueue.sort(function(a,b){return a.sid-b.sid;});
    scheduleReady();
  },function(){
    // 解码失败（如 edge-tts 中途失败推来的残缺音频）：跳过该 sid，避免播放队列卡死
    if(!V.suppressAudio){V.skippedSids[sid]=true;scheduleReady();}
  });
}
function scheduleReady(){
  if(V.suppressAudio)return;
  if(V.fallbackActive>0)return; // 本地降级语音正在播：等它结束再播 WebAudio，避免双声重叠
  while(true){
    if(V.skippedSids[V.nextPlaySid]){ // 该 sid 已丢弃（解码失败），跳到下一个
      delete V.skippedSids[V.nextPlaySid];
      V.nextPlaySid++;
      continue;
    }
    if(!V.playQueue.length||V.playQueue[0].sid!==V.nextPlaySid)break;
    var item=V.playQueue.shift();
    playBuffer(item.buf);
    V.nextPlaySid++;
  }
}
function playBuffer(buf){
  var src=V.audioCtx.createBufferSource();
  src.buffer=buf;src.connect(V.audioCtx.destination);
  var now=V.audioCtx.currentTime;
  var t=Math.max(now+0.02,V.playTime); // 紧接上一段结束时间，零间隙
  src.start(t);
  V.activeSources.push(src); // 记录正在/将要播放的源，挂断时可强制停止
  V.playTime=t+buf.duration;
  V.pendingSources++;
  V.playingAudio=true;
  src.onended=function(){
    var i=V.activeSources.indexOf(src);
    if(i>=0)V.activeSources.splice(i,1);
    if(V.pendingSources>0)V.pendingSources--;
    if(V.pendingSources<=0){V.playingAudio=false;audioDone();}
  };
}
function audioDone(){
  if(V.suppressAudio)return; // 打断/挂断后：忽略在途音频结束回调，避免重开回声窗口/复位状态
  if(V.pendingSources>0||V.fallbackActive>0)return; // WebAudio 块与本地降级语音都播完才算结束
  if(V.fallbackQueue.length){drainFallback();return;} // 还有排队中的降级语音，先播完
  _dbg('播报结束');
  // 播报结束 → 恢复聆听状态
  V.speaking=false;
  V.echoUntil=Date.now()+2500; // 回声窗口：ASR 延迟可达 2s，播完/打断后滞留的回声可能后到，期间仍做回声过滤
  setSpeakingUI(false);
  if(V.replyEnded&&V.active){setStatus('聆听中…');}
}
function stopAudio(){
  V.playingAudio=false;V.suppressAudio=true;
  V.pendingSources=0;V.playQueue=[];V.sidData={};
  V.nextPlaySid=0;V.playTime=0;V.skippedSids={};
  V.fallbackActive=0;V.fallbackBySid={};V.fallbackQueue=[]; // 清残留，避免打断后旧 sid 的 tts_error 误触发
  V.vadHits=0;V.vadAvg=0;
  setSpeakingUI(false);
  while(V.activeSources.length){var s=V.activeSources.pop();try{s.stop();s.disconnect();}catch(e){}}
  try{w.speechSynthesis.cancel();}catch(e){}
}

/* ---- 打断：由 ASR 内容级识别承担（handleAsrText→sendText；中间结果→bargeIn）。
   原 VAD 音量打断已禁用：小P 外放回声的音量波动与用户开口无法靠音量区分，
   调阈值只会两头堵——要么误打断小P，要么用户打不断。 ---- */
function bargeIn(){
  if(!V.speaking)return;
  _dbg('打断触发');
  stopAudio();
  V.speaking=false;V.buf='';V.replyEnded=false;V.liveBubble=null;
  V.echoUntil=Date.now()+2500;
  setSpeakingUI(false);
  if(V.ws&&V.ws.readyState===1){V.ws.send(JSON.stringify({type:'stop'}));}
  setStatus('已打断，请继续');
}
function initVAD(){
  if(V.vadOn)return;
  try{
    w.navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}})
    .then(function(stream){
      V.vadOn=true;
      ensureAudio();
      var srcNode=V.audioCtx.createMediaStreamSource(stream);
      V.analyser=V.audioCtx.createAnalyser();
      V.analyser.fftSize=1024;
      srcNode.connect(V.analyser);
      V.vadData=new Uint8Array(V.analyser.fftSize);
      vadLoop();
    }).catch(function(){V.vadOn=false;});
  }catch(e){}
}
function vadLoop(){
  if(!V.active){V.vadHits=0;V.quietTicks=0;setTimeout(vadLoop,200);return;}
  if(V.analyser&&V.vadData){
    // VAD 音量打断已禁用：小P 外放回声的音量波动（TTS 动态范围峰值/均值可达 3-5 倍）
    // 与用户开口在音量上无法可靠区分，调阈值只会两头堵——要么误打断小P，要么用户打不断。
    // 打断统一由 ASR 内容级识别承担（handleAsrText：用户的话与小P 播报内容不同 → 打断；
    // 小P 的回声与播报内容一致 → _isEchoLike 拦截），准确且不受回声音量影响。
    V.vadHits=0;V.quietTicks=0;V.bargeArmed=false;
  }
  setTimeout(vadLoop,60);
}

/* ---- 回退：edge-tts 失败时用本地语音（自动挑选最自然的中文音色）---- */
function pickVoice(){
  var vs=w.speechSynthesis.getVoices();
  if(!vs||!vs.length)return null;
  var prefs=['Xiaoxiao','Xiaoyi','YunxiNeural','Xiaoyan','Huihui','Yaoyao','XiaoYun','Lili','zh-CN'];
  for(var i=0;i<prefs.length;i++){
    for(var j=0;j<vs.length;j++){
      var name=vs[j].name||'';
      if(name.indexOf(prefs[i])>=0)return vs[j];
    }
  }
  for(var k=0;k<vs.length;k++){if((vs[k].lang||'').indexOf('zh')===0)return vs[k];}
  return null;
}
function speakFallback(text){
  if(!text)return;
  if(V.suppressAudio)return; // 打断/挂断后，旧回复在途 tts_error 直接忽略，避免重新开始播报
  // 有 WebAudio 正在/将要播、或已有降级语音在说 → 排队，播完一个再播下一个：
  // 否则降级语音会与在线音频重叠，或插队打乱句子顺序
  if(V.pendingSources>0||V.fallbackActive>0){V.fallbackQueue.push(text);return;}
  startFallbackSpeech(text);
}
function drainFallback(){
  if(V.suppressAudio)return;
  if(V.fallbackQueue.length){startFallbackSpeech(V.fallbackQueue.shift());return;}
  scheduleReady(); // 降级语音结束后，继续播排队中的 WebAudio（若有）
  audioDone();
}
function startFallbackSpeech(text){
  if(!V.speaking){
    // 播报中也持续发送音频给 ASR：回声由 handleAsrText 的 _isEchoLike 内容级过滤
    V.speaking=true;setStatus('播报中…',true);setSpeakingUI(true);
    V.quietTicks=0;V.vadHits=0;V.bargeArmed=false;V.noiseFloor=0;V.bargeWait=0;
  }
  V.fallbackActive++;
  function fallbackEnd(){
    V.fallbackActive=Math.max(0,V.fallbackActive-1);
    drainFallback();
  }
  function doSpeak(){
    var u=new SpeechSynthesisUtterance(text);
    u.lang='zh-CN';u.rate=0.95;u.pitch=1.1;
    var voice=pickVoice();if(voice)u.voice=voice;
    u.onend=fallbackEnd;
    u.onerror=fallbackEnd;
    try{w.speechSynthesis.speak(u);}catch(e){fallbackEnd();}
  }
  // Chrome 首次调用时音色列表可能还没加载完成，等待 voiceschanged 再播，
  // 否则可能完全无声；超时 1.5s 兜底直接播。
  var vs=w.speechSynthesis.getVoices();
  if((!vs||!vs.length)&&!V.voicesWaiting){
    V.voicesWaiting=true;
    var once=function(){
      V.voicesWaiting=false;
      w.speechSynthesis.onvoiceschanged=null;
      doSpeak();
    };
    w.speechSynthesis.onvoiceschanged=once;
    setTimeout(once,1500);
  }else{
    doSpeak();
  }
}

function connect(){
  ensureAudio();
  initVAD();
  try{w.speechSynthesis.getVoices();}catch(e){}
  var proto=(w.location.protocol==='https:')?'wss://':'ws://';
  var url=proto+w.location.host+'/ws/voice';
  V.active=true;render();setStatus('正在接通…',true);
  var ws;
  try{ws=new WebSocket(url);}catch(e){setStatus('无法连接语音服务');V.active=false;render();return;}
  V.ws=ws;
  // 重连后清掉上次的防抖记录，避免 2 秒内重说同一句话被去重吞掉
  V.lastSend=0;V.lastSendText='';
  V.timerStart=Date.now();
  if(V.timerInt)clearInterval(V.timerInt);
  V.timerInt=setInterval(updateTimer,1000);
  updateTimer();
  // WS 就绪后启动麦克风采集 → 后端 DashScope ASR 流式识别；
  // 小P 播报时暂停发送音频（防回声），用户开口（VAD 打断）后恢复，ASR 立即识别
  ws.onopen=function(){
    setStatus('正在接通…');
    startAudioStream();
  };
  ws.onmessage=function(ev){
    var m;
    try{m=JSON.parse(ev.data);}catch(e){return;}
    if(m.type==='reply_start'){
      // 新回复开始：丢弃上一轮未播完/未播放的音频，sid 从头编号，避免串台
      stopAudio();
      V.speaking=false;
      // 旧播报文本暂存为回声过滤基准（拦截打断前已进 ASR 管线的旧回声，
      // 见 _isEchoLike 的 prevSpeechText 分支）；echoUntil 过期后自动失效
      V.prevSpeechText=V.speakingText||'';
      V.speakingText='';
      // 不回零 echoUntil：让其自然过期（2500ms），避免打断后滞留 ASR 管线的
      // 旧回声因窗口提前关闭而绕过过滤
      V.replyEnded=false;V.suppressAudio=false;V.nextPlaySid=m.first_sid||0;
      // 文本已就绪、在线合成需要数秒（CosyVoice 单次请求 4-6s）：先给用户明确反馈
      setStatus('正在合成语音…',true);
    }
    else if(m.type==='delta'){
      if(V.suppressAudio)return; // 打断/挂断后：在途旧回复 delta 直接忽略，避免污染 buf/speakingText
      V.buf+=m.content;V.speakingText+=m.content;updateLive(V.buf);
    }
    else if(m.type==='audio_start')onAudioStart(m.sid,m.text);
    else if(m.type==='audio')onAudioFrame(m.sid,m.data);
    else if(m.type==='audio_end')onAudioEnd(m.sid);
    else if(m.type==='tts_error'){
      // 该 sid 永不会有音频：登记跳过并推进播放指针，避免后续真实音频排队等一个不存在的 sid
      V.skippedSids[m.sid]=true;
      scheduleReady();
      speakFallback(V.fallbackBySid[m.sid]||'');
    }
    else if(m.type==='done'){if(V.suppressAudio)return;V.replyEnded=true;setTimeout(audioDone,300);}
    else if(m.type==='cancelled'){
      if(!V.suppressAudio)return; // 新回复已开始，迟到的 cancelled 不再清空新回复的 buf
      V.buf='';setStatus('已打断，请继续');
    }
    else if(m.type==='asr_ready'){V.asrReady=true;V.asrRetries=0;V.lastAsrEvent=Date.now();setStatus('聆听中…');_dbg('ASR 就绪');}
    else if(m.type==='asr_error'){
      V.asrReady=false;V.lastAsrEvent=0; // ASR 失效：音量兜底打断立即生效
      setStatus('语音识别不可用: '+(m.message||''),true);
      // DashScope 瞬时网络/限流问题：3 秒后自动重试几次，避免用户必须重连才能恢复识别
      if(V.active&&V.asrRetries<3&&V.ws&&V.ws.readyState===1){
        V.asrRetries++;
        _dbg('ASR 失败，'+V.asrRetries+'/3 次重试…');
        setTimeout(function(){
          if(V.active&&V.ws&&V.ws.readyState===1){
            V.ws.send(JSON.stringify({type:'asr_start',sample_rate:V.asrSampleRate}));
          }
        },3000);
      }
    }
    else if(m.type==='asr_text'){if(m.content)handleAsrText(m.content);}
    else if(m.type==='asr_partial'){
      // 中间结果（还没说完）：只要不是回声，说明用户已在开口 → 立即打断小P，
      // 等完整句子识别出后再发去 LLM，实现"开口即打断"而不是"说完一句才打断"
      if(!V.speaking)return;
      var pt=(m.content||'').trim();
      if(!pt)return;
      V.lastAsrEvent=Date.now();
      _dbg('ASR中间: '+pt.slice(0,16));
      if(_isEchoLike(pt)){_dbg('回声忽略(中间): '+pt.slice(0,14));return;}
      _dbg('开口打断(中间结果): '+pt.slice(0,18));
      bargeIn();
    }
    else if(m.type==='error'){
      // 服务端生成出错：复位播报状态，避免卡在"播报中…"；同时清空回声
      // 过滤基准，避免报错后残留 speakingText/echoUntil 误吞后续插话
      V.speaking=false;V.replyEnded=true;V.suppressAudio=true;
      V.speakingText='';V.prevSpeechText='';V.echoUntil=0;
      setSpeakingUI(false);
      setStatus('小P出错了: '+m.message,true);
    }
  };
  ws.onclose=function(){
    var wasActive=V.active;
    V.ws=null;stopAudioStream();stopAudio();
    V.buf='';V.speaking=false;V.active=false;V.liveBubble=null;render();
    V.speakingText='';V.prevSpeechText='';V.echoUntil=0;V.asrRetries=0;
    if(V.timerInt){clearInterval(V.timerInt);V.timerInt=null;}
    if(wasActive)setStatus('通话已断开');
  };
  ws.onerror=function(){setStatus('连接语音服务失败，请确认已启动 voice_server',true);};
}
function hangup(){
  V.active=false;render();
  stopAudioStream();stopAudio();
  V.speaking=false;V.buf='';V.liveBubble=null;
  V.speakingText='';V.prevSpeechText='';V.echoUntil=0;V.asrRetries=0;
  if(V.timerInt){clearInterval(V.timerInt);V.timerInt=null;}
  if(V.ws){try{V.ws.close();}catch(e){}}
  V.ws=null;
  setStatus('已挂断');setTimeout(function(){st.textContent='未连接 · 点击下方按钮接通';st.classList.remove('busy');var el=d.getElementById('timer');if(el)el.textContent='00:00';},1500);
}
if(!V.bound){
  V.bound=true;
  // 播报中点击状态条 = 手动打断（ASR 未识别到时可用的兜底）
  st.onclick=function(){
    if(V.speaking){bargeIn();}
  };
  var micBtn=d.getElementById('micTest');
  if(micBtn){micBtn.onclick=function(){micTest();};}
  btn.onclick=function(){
    if(!V.active){connect();return;}
    hangup(); // 按钮=挂断；语音打断由 VAD（开口说话）负责
  };
  w.addEventListener('beforeunload',function(){
    try{V.active=false;stopAudioStream();stopAudio();if(V.ws)V.ws.close();V.ws=null;}catch(e){}
  });
}
render();
setMode('辅导答疑');
fetchCustomStatus();
})();
</script>
</body>
</html>
