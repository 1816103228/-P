services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "8765:8765"
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY}
      APP_HOST: 0.0.0.0
      APP_PORT: 8765
      DISABLE_SCHEDULER: "0"
    volumes:
      - interview-data:/app/data

volumes:
  interview-data:
